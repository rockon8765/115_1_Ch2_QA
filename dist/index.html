<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台大領袖社 × 台科領袖社 聯合社課課前問卷</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b7a5a'/%3E%3Cpath d='M49 14A23 23 0 1 0 53 40' fill='none' stroke='%23fffdf8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="台大領袖社與台科領袖社聯合社課：專注力自我覺察">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 設定 ===== */
  :root {
    --bg: #f5f1e8;
    --paper: #fffdf8;
    --ink: #2b2a26;
    --muted: #6f6a5f;
    --line: #e3dccc;
    --accent: #5b7a5a;      /* 松綠 */
    --accent-soft: #e6eee3;
    --warn: #a4483a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1a;
      --paper: #252522;
      --ink: #ece7dc;
      --muted: #a39d90;
      --line: #3a3934;
      --accent: #8fb08c;
      --accent-soft: #2f3a2e;
      --warn: #e08a7c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1a; --paper: #252522; --ink: #ece7dc; --muted: #a39d90;
    --line: #3a3934; --accent: #8fb08c; --accent-soft: #2f3a2e; --warn: #e08a7c;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 76px 16px 64px; }

  header { text-align: center; margin-bottom: 28px; }
  .enso {
    width: 64px; height: 64px; margin: 0 auto 12px; display: block;
  }
  .kicker { color: var(--muted); font-size: .9rem; letter-spacing: .2em; margin: 0; }
  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 700;
    font-size: clamp(1.5rem, 5vw, 2rem); margin: 4px 0 8px; letter-spacing: .05em;
  }
  .intro { color: var(--muted); margin: 0 auto; max-width: 30em; font-size: 1rem; }
  header .intro { white-space: pre-line; }

  form { display: grid; gap: 18px; }
  form[hidden] { display: none; }
  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 18px;
  }
  .card.invalid { border-color: var(--warn); }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; }
  .q-no {
    flex: none; font-family: "Noto Serif TC", serif; color: var(--accent);
    font-weight: 700; font-size: 1.05rem;
  }
  .q-title { display: block; font-weight: 500; margin: 0; font-size: 1.02rem; }
  .q-tag { display: inline-block; font-size: .875rem; color: var(--accent);
    background: var(--accent-soft); border-radius: 99px; padding: 0 10px; margin-bottom: 6px; }
  .req { color: var(--warn); margin-left: 2px; }

  input[type="text"], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    outline: none; appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  textarea { resize: vertical; min-height: 112px; line-height: 1.7; }
  .optional { color: var(--muted); font-size: .875rem; font-weight: 400; }
  .ask-summary { white-space: pre-wrap; overflow-wrap: anywhere; }

  .options { display: grid; gap: 8px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt label {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    background: var(--bg); transition: border-color .15s, background .15s;
  }
  .dots { flex: none; display: inline-flex; gap: 3px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.on { background: var(--accent); }
  .opt-text { font-size: .95rem; }
  .opt label:hover { border-color: var(--accent); }
  .opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .opt input:focus-visible + label { box-shadow: 0 0 0 3px var(--accent-soft); }
  .scale-hint { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-top: 8px; }

  .err { color: var(--warn); font-size: .85rem; margin: 8px 0 0; display: none; }
  .card.invalid .err { display: block; }

  button {
    font: inherit; font-weight: 700; letter-spacing: .2em; cursor: pointer;
    background: var(--accent); color: var(--paper); border: none;
    border-radius: 99px; padding: 14px 20px; width: 100%;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .music-toggle {
    position: fixed; top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right)); z-index: 10;
    width: auto; min-height: 44px; padding: 8px 14px;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .9rem; font-weight: 500; letter-spacing: normal;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    box-shadow: 0 2px 8px #0002;
  }
  .music-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .music-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .survey-start { text-align: center; }
  .status { text-align: center; font-size: .9rem; min-height: 1.5em; margin: 0; }
  .status.error { color: var(--warn); }
  .survey-start .status { min-height: 0; }
  .survey-start .status:not(:empty) { margin-top: 12px; }

  .done { display: none; text-align: center; }
  .done.show { display: block; }
  .done h2 { font-family: "Noto Serif TC", serif; margin: 8px 0; }
  .summary { text-align: left; margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .summary li { border-top: 1px solid var(--line); padding-top: 10px; font-size: .92rem; }
  .summary b { color: var(--accent); font-weight: 500; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 32px; }
</style>
</head>
<body>
<button type="button" id="musicToggle" class="music-toggle" aria-label="播放音樂" aria-pressed="false" aria-controls="backgroundMusic" hidden>
  <span aria-hidden="true">♪</span><span id="musicToggleText">播放音樂</span>
</button>
<div class="wrap">
  <header>
    <svg class="enso" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M50 14 A24 24 0 1 0 54 40" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <p class="kicker">台大領袖社 × 台科領袖社</p>
    <h1>課前 QA：專注力自我覺察</h1>
    <p class="intro">花一分鐘，誠實觀察自己平常的專注狀態。
沒有標準答案，選最接近你「最近一週」實際情況的選項就好。</p>
  </header>

  <audio id="backgroundMusic" loop preload="metadata" hidden aria-hidden="true">
    <source src="./assets/background-music.mp3" type="audio/mpeg">
  </audio>

  <section class="card survey-start" id="surveyStart">
    <button type="button" id="startSurveyBtn" aria-controls="qa" disabled>載入問卷中…</button>
    <p class="status" id="startStatus" role="status" aria-live="polite"></p>
  </section>

  <form id="qa" novalidate hidden>
    <div class="card" data-field="name">
      <div class="q-head"><span class="q-no">一</span><label class="q-title" for="name">你的姓名<span class="req">*</span></label></div>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="30" placeholder="請輸入姓名">
      <p class="err">請填寫姓名</p>
    </div>

    <div class="card" data-field="club">
      <div class="q-head"><span class="q-no">二</span><label class="q-title" for="club">你是哪個社團的夥伴呢<span class="req">*</span></label></div>
      <select id="club" name="club">
        <option value="" selected disabled>請選擇</option>
        <option>台大領袖社</option><option>台科領袖社</option>
      </select>
      <p class="err">請選擇社團</p>
    </div>

    <div id="questions"></div>

    <div class="card" data-field="ask">
      <div class="q-head"><span class="q-no">七</span><label class="q-title" for="ask">有沒有想問講師的問題呢~ <span class="optional" id="ask-optional">（選填）</span></label></div>
      <textarea id="ask" name="ask" rows="4" maxlength="500" placeholder="寫下你的問題"></textarea>
      <p class="err" id="ask-error">最多可填寫 500 字</p>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button type="submit" id="submitBtn">送出</button>
  </form>

  <section class="done card" id="done">
    <svg class="enso" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M50 14 A24 24 0 1 0 54 40" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h2>已收到，謝謝你！</h2>
    <p class="intro">這是你這次的自我覺察，社課上我們一起練習，期末再回來看看有沒有不一樣。</p>
    <ul class="summary" id="summary"></ul>
  </section>

  <footer>台大領袖社 × 台科領袖社 · 聯合社課</footer>
</div>

<script>
const backgroundMusic = document.getElementById("backgroundMusic");
const musicToggle = document.getElementById("musicToggle");
const musicToggleText = document.getElementById("musicToggleText");
let musicEnabled = true;
let surveyStarted = false;
let surveyOpen = false;
backgroundMusic.volume = 0.4;
function renderMusicState() {
  const playing = musicEnabled && !backgroundMusic.paused;
  musicToggle.setAttribute("aria-pressed", String(playing));
  musicToggleText.textContent = playing ? "音樂：開" : musicEnabled ? "播放音樂" : "音樂：關";
  musicToggle.setAttribute("aria-label", playing ? "關閉音樂" : "播放音樂");
}
function startBackgroundMusic() {
  if (!musicEnabled || !backgroundMusic.paused) return;
  // 在使用者手勢內直接呼叫 play，讓瀏覽器允許有聲播放。
  try {
    Promise.resolve(backgroundMusic.play()).then(() => {
      if (!musicEnabled) backgroundMusic.pause();
      renderMusicState();
    }).catch(renderMusicState);
  } catch {
    renderMusicState();
  }
}
musicToggle.addEventListener("click", () => {
  if (musicEnabled && !backgroundMusic.paused) {
    musicEnabled = false;
    backgroundMusic.autoplay = false;
    backgroundMusic.pause();
    renderMusicState();
  } else {
    musicEnabled = true;
    startBackgroundMusic();
  }
});
backgroundMusic.addEventListener("playing", () => {
  if (!musicEnabled) backgroundMusic.pause();
  renderMusicState();
});
backgroundMusic.addEventListener("pause", renderMusicState);
backgroundMusic.addEventListener("error", renderMusicState);
for (const event of ["click", "touchend", "keydown"]) {
  document.addEventListener(event, e => {
    // 開關本身由 click 處理，避免同一次操作先播放、又立刻關閉。
    if (!surveyStarted || (e.target.closest && e.target.closest("#musicToggle"))) return;
    startBackgroundMusic();
  }, { capture: true, passive: true });
}
renderMusicState();

/* ============================================================
 * 1) 部署好 Google Apps Script 之後，把「網頁應用程式網址」貼在這裡
 * ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4z-XJpzCk1FCge3gdB-0yjNW_ApeHy2Mu3_XK4xug4YMzYLpZNTxJYqE-gGLgQ9LV/exec";

const isAppsScript = typeof google !== "undefined" && google.script && google.script.run;
let surveyVersion = "initial";
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }


/* ============================================================
 * 2) 三題自我覺察題目（score 1 → 5 由低到高）
 * ============================================================ */
let QUESTIONS = [
  {
    id: "q1",
    tag: "專注持續力",
    title: "讀書、上課或工作時，我的注意力通常能維持多久，才會開始分心（想別的事、拿起手機）？",
    options: ["不到 5 分鐘", "約 5–15 分鐘", "約 15–30 分鐘", "約 30–60 分鐘", "超過 1 小時"],
    low: "很快分心", high: "長時間專注"
  },
  {
    id: "q2",
    tag: "拉回當下",
    title: "當我發現自己分心，或被情緒、雜念影響時，我能多快把心拉回來、重新專注在眼前的事？",
    options: [
      "幾乎拉不回來，整段時間都被打斷",
      "要花很久，通常得休息或換個環境",
      "有時拉得回來，有時拉不回來",
      "多數時候幾分鐘內就能拉回來",
      "幾乎能立刻察覺，並馬上回到當下"
    ],
    low: "難以拉回", high: "立刻回到當下"
  },
  {
    id: "q3",
    tag: "心腦一致",
    title: "日常生活中，我感覺「心裡的感受」與「腦中所想、手上所做」是一致的，內在平穩且投入的頻率是？",
    options: [
      "幾乎從不，心常常很亂、想的和做的不同調",
      "很少",
      "有時候",
      "經常",
      "幾乎總是，身心合一、內在平靜"
    ],
    low: "心亂不同調", high: "身心合一"
  }
];

let ASK = { title: "有沒有想問講師的問題呢~", placeholder: "寫下你的問題", maxLength: 500, required: false };
function renderAsk() {
  const input = document.getElementById("ask");
  input.placeholder = ASK.placeholder;
  input.maxLength = ASK.maxLength;
  input.required = ASK.required;
  const hint = document.getElementById("ask-optional");
  hint.textContent = ASK.required ? "*" : "（選填）";
  hint.className = ASK.required ? "req" : "optional";
  document.getElementById("ask-error").textContent = ASK.required ? "請填寫問題，最多 " + ASK.maxLength + " 字" : "最多可填寫 " + ASK.maxLength + " 字";
}

const CN_NO = ["三", "四", "五", "六"];
const box = document.getElementById("questions");
function renderQuestions() {
box.replaceChildren();
QUESTIONS.forEach((q, qi) => {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.field = q.id;
  card.setAttribute("role", "radiogroup");
  card.setAttribute("aria-labelledby", q.id + "-title");
  card.innerHTML = `
    <span class="q-tag">${escapeHtml(q.tag)}</span>
    <div class="q-head"><span class="q-no">${CN_NO[qi] || qi + 3}</span>
      <p class="q-title" id="${q.id}-title">${escapeHtml(q.title)}<span class="req">*</span></p></div>
    <div class="options">
      ${q.options.map((text, i) => `
        <div class="opt">
          <input type="radio" name="${q.id}" id="${q.id}-${i + 1}" value="${i + 1}">
          <label for="${q.id}-${i + 1}">
            <span class="dots" aria-hidden="true">${[1,2,3,4,5].map(d => `<i class="${d <= i + 1 ? "on" : ""}"></i>`).join("")}</span>
            <span class="opt-text">${escapeHtml(text)}</span>
          </label>
        </div>`).join("")}
    </div>
    <div class="scale-hint"><span>1 · ${escapeHtml(q.low)}</span><span>${escapeHtml(q.high)} · 5</span></div>
    <p class="err">請選擇一個選項</p>`;
  box.appendChild(card);
});

}
renderQuestions();

const form = document.getElementById("qa");
const statusEl = document.getElementById("status");
const btn = document.getElementById("submitBtn");
const surveyStart = document.getElementById("surveyStart");
const startSurveyBtn = document.getElementById("startSurveyBtn");
const startStatus = document.getElementById("startStatus");

startSurveyBtn.addEventListener("click", () => {
  if (!surveyOpen || surveyStarted) return;
  surveyStarted = true;
  // 直接在點擊事件內播放；音樂失敗也讓學員繼續填答。
  startBackgroundMusic();
  form.hidden = false;
  musicToggle.hidden = false;
  document.getElementById("name").focus({ preventScroll: true });
  surveyStart.hidden = true;
});

form.addEventListener("input", e => {
  const card = e.target.closest(".card");
  if (card) card.classList.remove("invalid");
});
form.addEventListener("change", e => {
  const card = e.target.closest(".card");
  if (card) card.classList.remove("invalid");
});

let pendingId = "";
let pendingPayload = "";
function collect() {
  const data = {
    name: document.getElementById("name").value.trim(),
    club: document.getElementById("club").value,
    ask: document.getElementById("ask").value.trim()
  };
  QUESTIONS.forEach(q => {
    const checked = form.querySelector(`input[name="${q.id}"]:checked`);
    data[q.id + "_score"] = checked ? Number(checked.value) : null;
    data[q.id + "_answer"] = checked ? q.options[Number(checked.value) - 1] : "";
  });
  return data;
}

function validate(data) {
  let firstBad = null;
  const mark = (field, ok) => {
    const card = form.querySelector(`.card[data-field="${field}"]`);
    card.classList.toggle("invalid", !ok);
    if (!ok && !firstBad) firstBad = card;
  };
  mark("name", !!data.name);
  mark("club", !!data.club);
  QUESTIONS.forEach(q => mark(q.id, data[q.id + "_score"] !== null));
  mark("ask", (!ASK.required || !!data.ask) && data.ask.length <= ASK.maxLength);
  if (firstBad) firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
  return !firstBad;
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  if (btn.disabled) return;
  const data = collect();
  data.version = surveyVersion;
  const payload = JSON.stringify(data);
  if (payload !== pendingPayload) { pendingId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2); pendingPayload = payload; }
  data.responseId = pendingId;
  if (!validate(data)) {
    statusEl.textContent = "還有題目沒填喔";
    statusEl.className = "status error";
    return;
  }
  if (!isAppsScript && !SCRIPT_URL) {
    statusEl.textContent = "此頁為預覽，尚未連接 Google 試算表，暫時無法送出。";
    statusEl.className = "status error";
    return;
  }
  btn.disabled = true;
  btn.textContent = "送出中…";
  statusEl.textContent = "";
  statusEl.className = "status";
  try {
    // 用 text/plain 送 JSON，避免瀏覽器對 Apps Script 發出 CORS preflight
    let out;
    if (isAppsScript) {
      out = await new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitResponse(data));
    } else {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    });
    out = await res.json();
    }
    if (!out.ok) throw new Error(out.error || "送出失敗");
    showDone(data);
  } catch (err) {
    console.error(err);
    statusEl.textContent = err.message || "送出失敗，請確認網路後再試一次。";
    statusEl.className = "status error";
    btn.disabled = false;
    btn.textContent = "送出";
  }
});

function showDone(data) {
  form.style.display = "none";
  const ul = document.getElementById("summary");
  ul.innerHTML = QUESTIONS.map(q =>
    `<li>${escapeHtml(q.tag)}：<b>${data[q.id + "_score"]} / 5</b>　${escapeHtml(data[q.id + "_answer"])}</li>`
  ).join("") + (data.ask ? `<li class="ask-summary">想問講師：${escapeHtml(data.ask)}</li>` : "");
  document.getElementById("done").classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function loadSurvey() {
  if (!isAppsScript && !SCRIPT_URL) {
    statusEl.textContent = "預覽模式：尚未連接 Google 試算表，暫時無法送出。";
    startStatus.textContent = "尚未連接問卷後台，暫時無法開始。";
    startSurveyBtn.textContent = "暫時無法開始";
    return;
  }
  btn.disabled = true; btn.textContent = "載入問卷中…";
  try {
    const result = isAppsScript
      ? await new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getSurvey())
      : await (await fetch(SCRIPT_URL + "?action=config")).json();
    if (!result.ok) throw new Error(result.error || "問卷載入失敗");
    const cfg = result.survey;
    surveyVersion = cfg.version;
    QUESTIONS = cfg.questions;
    if (!cfg.ask) throw new Error("問卷尚未開放簡答題，請聯絡主辦夥伴。");
    ASK = { ...cfg.ask, title: "有沒有想問講師的問題呢~" };
    renderAsk();
    document.title = cfg.title;
    document.querySelector("header h1").textContent = cfg.title;
    document.querySelector(".kicker").textContent = cfg.subtitle;
    document.querySelector("header .intro").textContent = cfg.intro.replace(/\s*沒有標準答案/, "\n沒有標準答案");
    document.querySelector("#done .intro").textContent = cfg.thanks;
    document.querySelector("footer").textContent = cfg.subtitle + " · 聯合社課";
    const select = document.getElementById("club");
    select.replaceChildren();
    const placeholder = new Option("請選擇社團", ""); placeholder.disabled = true; placeholder.selected = true; select.add(placeholder);
    cfg.clubs.forEach(club => select.add(new Option(club, club)));
    renderQuestions();
    surveyOpen = cfg.open === true;
    if (!surveyOpen) {
      form.hidden = true;
      surveyStart.hidden = true;
      startSurveyBtn.textContent = "問卷暫停收件";
      document.getElementById("done").classList.add("show");
      document.querySelector("#done h2").textContent = "問卷暫停收件";
      document.querySelector("#done .intro").textContent = "請留意聯合社課通知，開放後再回來填寫。";
      return;
    }
    btn.disabled = false; btn.textContent = "送出";
    startSurveyBtn.disabled = false;
    startSurveyBtn.textContent = "開始填寫";
  } catch (error) {
    statusEl.textContent = "無法載入問卷，請重新整理或聯絡主辦夥伴。";
    statusEl.className = "status error";
    btn.textContent = "暫時無法送出";
    surveyOpen = false;
    startSurveyBtn.disabled = true;
    startSurveyBtn.textContent = "暫時無法開始";
    startStatus.textContent = "無法載入問卷，請重新整理或聯絡主辦夥伴。";
    startStatus.className = "status error";
  }
}
const modelContext = document.modelContext;
if (modelContext && modelContext.registerTool) {
  const lifecycle = new AbortController();
  try {
    Promise.resolve(modelContext.registerTool({
      name: "read_questionnaire",
      title: "讀取聯合社課問卷",
      description: "讀取目前顯示的題目、社團選項與問卷版本，不送出回覆。",
      inputSchema: { type: "object", properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true, untrustedContentHint: true },
      execute: async input => {
        if (!input || typeof input !== "object" || Array.isArray(input) || Object.keys(input).length) throw new Error("不接受參數");
        return { version: surveyVersion, questions: QUESTIONS, ask: ASK, clubs: Array.from(document.getElementById("club").options).map(o => o.value).filter(Boolean) };
      }
    }, { signal: lifecycle.signal })).catch(() => {});
    window.addEventListener("pagehide", () => lifecycle.abort(), { once: true });
  } catch {}
}
loadSurvey();

</script>
</body>
</html>
